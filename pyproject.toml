[project]
name = "dravert-songs"
version = "0.1.0"
description = "Archive of songs on poems by P. L. Dravert"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "gunicorn>=26.2.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]


[tool.ruff]
target-version = "py314"
line-length = 119
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "TCH", # flake8-type-checking
]
fixable = ["ALL"]
# The site is in Russian: Cyrillic letters that look like Latin ones are expected in strings and comments.
allowed-confusables = [
    "А", "В", "Е", "З", "К", "М", "Н", "О", "Р", "С", "Т", "У", "Х", "Ь",
    "а", "в", "г", "е", "к", "м", "н", "о", "п", "р", "с", "т", "у", "х", "ь", "ё", "Ё",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.rules]
all = "warn"

